name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # WPF projects build only on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore XmlOracleLoader/XmlOracleLoader.sln

      - name: Build
        run: dotnet build XmlOracleLoader/XmlOracleLoader.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test XmlOracleLoader/XmlOracleLoader.sln --configuration Release --no-build --verbosity normal
